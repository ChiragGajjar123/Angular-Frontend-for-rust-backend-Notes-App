version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.22.3
        - nvm use 22.22.3
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/cm-notes-angular/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
