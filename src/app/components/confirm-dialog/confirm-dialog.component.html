@if (visible) {
  <div class="confirm-overlay" (click)="cancel.emit()">
    <div class="confirm-dialog" (click)="$event.stopPropagation()">
      <div class="confirm-glow"></div>
      <div class="confirm-icon-wrap">
        <lucide-icon [img]="icons.AlertTriangle" [size]="28" class="confirm-icon"></lucide-icon>
      </div>
      <h3 class="confirm-title">{{ title }}</h3>
      <p class="confirm-message">{{ message }}</p>
      <div class="confirm-actions">
        <button class="confirm-btn confirm-btn-cancel" (click)="cancel.emit()">Cancel</button>
        <button class="confirm-btn confirm-btn-danger" (click)="confirm.emit()">Delete</button>
      </div>
    </div>
  </div>
}
