<header class="dashboard-header">
  <div class="header-left">
    <button class="menu-toggle-btn" (click)="notes.isSidebarOpen.set(true)">
      <lucide-icon [img]="icons.Menu" [size]="22"></lucide-icon>
    </button>
    <div class="search-bar">
      <lucide-icon [img]="icons.Search" [size]="18" class="search-icon"></lucide-icon>
      <input
        type="text"
        class="search-input"
        placeholder="Search title, tags, content..."
        [value]="notes.searchQuery()"
        (input)="notes.searchQuery.set($any($event.target).value)"
      />
    </div>
  </div>

  <div class="header-actions">
    <button
      class="icon-btn"
      [class.btn-loading]="notes.themeSaving()"
      (click)="notes.toggleTheme()"
      [disabled]="notes.themeSaving()"
      [title]="notes.themeSaving() ? 'Saving theme…' : notes.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      @if (notes.themeSaving()) {
        <app-spinner [size]="20" color="currentColor" />
      } @else if (notes.isDarkMode()) {
        <lucide-icon [img]="icons.Sun" [size]="20"></lucide-icon>
      } @else {
        <lucide-icon [img]="icons.Moon" [size]="20"></lucide-icon>
      }
    </button>
    <button class="btn-add-note" (click)="notes.handleOpenCreateModal()">
      <lucide-icon [img]="icons.Plus" [size]="20"></lucide-icon>
      <span>New Note</span>
    </button>
  </div>
</header>
