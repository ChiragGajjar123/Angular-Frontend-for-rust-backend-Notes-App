<div class="auth-container">
  <div class="auth-card">
    <div class="auth-glow"></div>

    <div class="auth-header">
      <div class="auth-logo">
        <app-icon name="sparkles" [size]="32" class="auth-logo-icon" />
        <span>CM Notes</span>
      </div>
      <p class="auth-subtitle">Capture thoughts, secure your ideas</p>
    </div>

    @if (error()) {
      <div class="alert alert-danger">
        <app-icon name="alert-circle" [size]="18" />
        <span>{{ error() }}</span>
      </div>
    }

    <form (ngSubmit)="handleSubmit()">
      <div class="form-group">
        <label for="login-email">Email</label>
        <div class="input-container">
          <app-icon name="mail" [size]="18" class="input-icon" />
          <input
            id="login-email"
            type="email"
            class="form-input"
            placeholder="Enter your email address"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            [disabled]="loading()"
            autocomplete="email"
            name="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="input-container">
          <app-icon name="lock" [size]="18" class="input-icon" />
          <input
            id="login-password"
            type="password"
            class="form-input"
            placeholder="••••••••"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            [disabled]="loading()"
            autocomplete="current-password"
            name="password"
          />
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [class.btn-loading]="loading()"
        [disabled]="loading()"
      >
        @if (loading()) {
          <app-spinner [size]="18" color="white" /> Logging in…
        } @else {
          <app-icon name="log-in" [size]="18" /> Log In
        }
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account?
      <a routerLink="/signup" class="auth-link">Sign up</a>
    </div>
  </div>
</div>
