@if (notes.isModalOpen()) {
  <div class="modal-overlay" (click)="notes.isModalOpen.set(false)">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-glow"></div>

      <div class="modal-header">
        <h3 class="modal-title">
          {{ notes.editingNote() ? 'Edit Note' : 'Create Note' }}
        </h3>
        <button
          class="modal-close-btn"
          (click)="notes.isModalOpen.set(false)"
          [disabled]="notes.modalSaving()"
        >
          <app-icon name="x" [size]="20" />
        </button>
      </div>

      <form (ngSubmit)="notes.handleFormSubmit()">
        <div class="modal-body">
          <div class="form-group">
            <label for="modal-title-input">Title</label>
            <input
              id="modal-title-input"
              type="text"
              class="form-input"
              placeholder="Note title..."
              [ngModel]="notes.noteForm().title"
              (ngModelChange)="updateFormField('title', $event)"
              [disabled]="notes.modalSaving()"
              name="title"
            />
          </div>

          <div class="form-group">
            <label for="modal-content-input">Content</label>
            <textarea
              id="modal-content-input"
              class="form-input form-textarea"
              placeholder="Write your note contents here..."
              [ngModel]="notes.noteForm().content"
              (ngModelChange)="updateFormField('content', $event)"
              [disabled]="notes.modalSaving()"
              name="content"
            ></textarea>
          </div>

          <div class="form-group">
            <label>Tags</label>
            <div class="tag-input-container">
              @for (tag of notes.noteForm().tags; track tag) {
                <span class="tag-badge">
                  #{{ tag }}
                  <button
                    type="button"
                    class="tag-remove-btn"
                    (click)="notes.handleRemoveTag(tag)"
                    [disabled]="notes.modalSaving()"
                  >
                    <app-icon name="x" [size]="12" />
                  </button>
                </span>
              }
              <input
                type="text"
                class="tag-text-input"
                placeholder="Add tag and press Enter"
                [ngModel]="notes.tagInput()"
                (ngModelChange)="notes.tagInput.set($event)"
                (keydown)="onTagKeydown($event)"
                (blur)="notes.handleAddTag()"
                [disabled]="notes.modalSaving()"
                name="tagInput"
              />
            </div>
          </div>

          <div class="form-group">
            <label>Note Color</label>
            <div class="color-selector">
              @for (colorOpt of colors; track colorOpt) {
                <div
                  class="color-option"
                  [class]="'color-option ' + colorOpt"
                  [class.selected]="notes.noteForm().color === colorOpt"
                  (click)="setColor(colorOpt)"
                >
                  @if (notes.noteForm().color === colorOpt) {
                    <app-icon name="check" [size]="14" class="color-check" />
                  }
                </div>
              }
            </div>
          </div>

          <div class="form-group form-group-row">
            <input
              id="modal-pin-input"
              type="checkbox"
              class="pin-checkbox"
              [ngModel]="notes.noteForm().pinned"
              (ngModelChange)="updateFormField('pinned', $event)"
              [disabled]="notes.modalSaving()"
              name="pinned"
            />
            <label for="modal-pin-input" class="pin-label">
              Pin this note to the top
            </label>
          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="notes.isModalOpen.set(false)"
            [disabled]="notes.modalSaving()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-primary btn-submit"
            [class.btn-loading]="notes.modalSaving()"
            [disabled]="notes.modalSaving()"
          >
            @if (notes.modalSaving()) {
              <app-spinner [size]="18" color="white" /> Saving…
            } @else {
              <app-icon name="check" [size]="18" /><span>Save Note</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
