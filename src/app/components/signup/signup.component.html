<div class="auth-container">
  <div class="auth-card">
    <div class="auth-glow"></div>

    <div class="auth-header">
      <div class="auth-logo">
        <app-icon name="sparkles" [size]="32" class="auth-logo-icon" />
        <span>CM Notes</span>
      </div>
      <p class="auth-subtitle">Join us to organize your tasks & ideas</p>
    </div>

    @if (error()) {
      <div class="alert alert-danger">
        <app-icon name="alert-circle" [size]="18" />
        <span>{{ error() }}</span>
      </div>
    }

    @if (success()) {
      <div class="alert alert-success">
        <app-icon name="check-circle" [size]="18" />
        <span>{{ success() }}</span>
      </div>
    }

    <form (ngSubmit)="handleSubmit()">
      <div class="form-group">
        <label for="signup-username">Username</label>
        <div class="input-container">
          <app-icon name="user" [size]="18" class="input-icon" />
          <input
            id="signup-username"
            type="text"
            class="form-input"
            placeholder="Pick a username"
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
            [disabled]="loading()"
            autocomplete="username"
            maxlength="100"
            name="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="signup-email">Email</label>
        <div class="input-container">
          <app-icon name="mail" [size]="18" class="input-icon" />
          <input
            id="signup-email"
            type="email"
            class="form-input"
            placeholder="you@example.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            [disabled]="loading()"
            autocomplete="email"
            name="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="signup-password">Password</label>
        <div class="input-container">
          <app-icon name="lock" [size]="18" class="input-icon" />
          <input
            id="signup-password"
            type="password"
            class="form-input"
            placeholder="••••••••"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            [disabled]="loading()"
            autocomplete="new-password"
            name="password"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="signup-confirm">Confirm Password</label>
        <div class="input-container">
          <app-icon name="lock" [size]="18" class="input-icon" />
          <input
            id="signup-confirm"
            type="password"
            class="form-input"
            placeholder="••••••••"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            [disabled]="loading()"
            autocomplete="new-password"
            name="confirmPassword"
          />
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [class.btn-loading]="loading()"
        [disabled]="loading()"
      >
        @if (loading()) {
          <app-spinner [size]="18" color="white" /> Creating Account…
        } @else {
          <app-icon name="user-plus" [size]="18" /> Sign Up
        }
      </button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <a routerLink="/login" class="auth-link">Log in</a>
    </div>
  </div>
</div>
